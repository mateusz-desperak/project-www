    <main>
        <section class="content-section">
            <h1>Zarezerwuj stolik</h1>
            <form action="#" method="POST" class="reservation-form">
                <label for="name">Imię i nazwisko:</label>
                <input type="text" id="name" name="name" required>

                <label for="date">Data rezerwacji:</label>
                <input type="date" id="date" name="date" required>

                <label for="time">Godzina:</label>
                <input type="time" id="time" name="time" required>

                <label for="guests">Liczba osób:</label>
                <input type="number" id="guests" name="guests" min="1" max="10" value="2">

                <button type="submit" class="btn-submit">Potwierdź rezerwację</button>
            </form>
        </section>
    </main>
